name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_forge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_forge_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_forge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Block critical runtime advisories
        run: npm run audit:ci
      - name: Generate CycloneDX SBOM
        run: npm run sbom > sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - name: Verify evidence-first source boundaries
        shell: bash
        run: |
          ! rg -n 'maturityScore|releaseScore|proofScore|criticalFailure' src/lib/agents/ai-runner.ts src/lib/agents/agent-schemas.ts src/lib/agents/quality-agent-schemas.ts
          ! rg -n '@ai-sdk|createGroq|generateText' src/lib/repository src/lib/evidence/registry.ts
          ! rg -n 'GITHUB_TOKEN' src/lib/github/fetch-repo-context.ts src/lib/github/repository-snapshot.ts
      - run: npm run build
        env:
          GROQ_API_KEY: ci-placeholder
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-thirty-two-characters
          GITHUB_CLIENT_ID: ci-placeholder
          GITHUB_CLIENT_SECRET: ci-placeholder
