name: Workers

# Free-tier pilot execution: the analysis worker is single-pass (--once).
# Schedules are best-effort and may be delayed or dropped; this is not an
# always-on worker and must not be used for latency/SLA guarantees.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   WORKERS_DATABASE_URL      Neon pooled connection string (same DB as Vercel)
#   GROQ_API_KEY              Provider key for inference stages
#   GITHUB_APP_ID             GitHub App id for repository collection
#   GITHUB_APP_PRIVATE_KEY_BASE64  App private key, base64 form (no newlines)
#
# For BYOK runs, set LLM_USER_KEY_MASTER_SECRET to the EXACT SAME secret as
# Vercel. The worker decrypts the selected user's key at inference time.
# Platform keys for other providers are optional, if configured on Vercel.
# Never run the synthetic sandbox-worker.ts stub against production data.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workers-main
  cancel-in-progress: false

jobs:
  durable:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run analysis worker (single pass)
        run: npm run worker:analysis -- --once
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.WORKERS_DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          GROQ_ALLOWED_MODELS: openai/gpt-oss-20b
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY_BASE64: ${{ secrets.GITHUB_APP_PRIVATE_KEY_BASE64 }}
          GITHUB_API_VERSION: '2022-11-28'
          LLM_USER_KEY_MASTER_SECRET: ${{ secrets.LLM_USER_KEY_MASTER_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANALYSIS_JOB_LEASE_MS: '60000'
          WORKER_CONCURRENCY: '2'
